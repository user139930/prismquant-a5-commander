<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PrismQuant · A5 指揮官</title>
<style>
:root{--ink:#1b2430;--red:#c8453a;--green:#1f7a63;--bg:#f4f5f7;--card:#fff;--line:#e6e9ee;--muted:#6b7280;--soft:#eef1f5}
*{box-sizing:border-box}
html{-webkit-font-smoothing:antialiased}
body{margin:0;font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.7}
.topbar{background:var(--card);border-bottom:1px solid var(--line);border-top:3px solid var(--red)}
.topbar .inner{max-width:860px;margin:0 auto;padding:16px 20px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand{font-size:16px;font-weight:700}
.brand .a5{color:var(--red)}
.pipe{color:var(--muted);font-size:12.5px}
main{max-width:860px;margin:0 auto;padding:24px 20px 64px}
.ask{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:20px}
.ask .row{display:flex;gap:10px}
input{flex:1;padding:11px 14px;border:1px solid var(--line);border-radius:6px;font-size:14px;font-family:inherit}
input:focus{outline:2px solid var(--red);outline-offset:-1px;border-color:transparent}
button{background:var(--ink);color:#fff;border:0;padding:11px 20px;border-radius:6px;font-size:13.5px;cursor:pointer;font-weight:600;letter-spacing:.2px}
button:hover{opacity:.88}
button:disabled{opacity:.5;cursor:default}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{background:var(--soft);border:1px solid var(--line);border-radius:16px;padding:5px 13px;font-size:12.5px;color:#3a4654;cursor:pointer}
.chip:hover{border-color:var(--red);color:var(--red)}
.upstream{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.up{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:6px 13px;font-size:12px;color:#3a4654;display:flex;align-items:center;gap:7px}
.dot{width:8px;height:8px;border-radius:50%;background:#8a8f98}
.dot.on{background:var(--green)}
.dot.off{background:var(--red)}
.loading{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:40px;text-align:center;color:var(--muted)}
.pulse{animation:blink 1.2s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px 22px;margin-bottom:14px}
.headline{font-family:Georgia,serif;font-size:20px;font-weight:600;line-height:1.4;margin:0 0 4px}
.qtxt{color:var(--muted);font-size:12px;margin:0 0 16px}
.brief{white-space:pre-wrap;font-size:15px;line-height:1.9;color:#2a3542}
.sec-title{font-size:12px;color:var(--muted);letter-spacing:.6px;margin:0 0 12px}
.ev{border-left:3px solid var(--red);padding:8px 14px;margin:10px 0;background:#fafafa;border-radius:0 6px 6px 0}
.ev b{color:var(--ink)}
.ev .p{color:#3a4654;margin-top:2px;font-size:13.5px}
.dis{background:#fff8f6;border:1px solid #f3d9d4;border-radius:8px;padding:12px 14px;margin:10px 0}
.dis .t{font-weight:600;font-size:13.5px}
.dis .s{font-size:13px;color:#3a4654;margin-top:6px}
.dis .s span{color:var(--muted)}
.risk{margin-top:8px;color:var(--red);font-size:13px}
.note{margin-bottom:12px;background:#fff8f0;border:1px solid #f0dfc8;border-radius:8px;padding:10px 14px;color:#8a6d3b;font-size:13px}
.pipeline{margin-top:28px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px 18px}
.pipeline .tt{font-size:12px;color:var(--muted);margin-bottom:10px;letter-spacing:.5px}
.pipeline .steps{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.step{background:var(--soft);border-radius:6px;padding:6px 12px;font-size:12.5px;color:#3a4654}
.arrow{color:var(--muted)}
</style>
</head>
<body>
<div class="topbar"><div class="inner">
  <span class="brand">PrismQuant <span class="a5">· A5 指揮官</span></span>
  <span class="pipe">匯總 A1 新聞 + A2 政要監控 → 一份 10 分鐘讀得完的晨報</span>
</div></div>
<main>
  <div class="upstream" id="upstream"></div>
  <div class="ask">
    <div class="row">
      <input id="q" placeholder="問指揮官，例如：今天該留意什麼風險？" onkeydown="if(event.key==='Enter')runA5()">
      <button id="send" onclick="runA5()">發送</button>
    </div>
    <div class="chips">
      <span class="chip" onclick="runA5('生成今天的晨報')">生成今天的晨報</span>
      <span class="chip" onclick="runA5('今天該留意什麼風險？')">今天該留意什麼風險？</span>
      <span class="chip" onclick="runA5('匯總一下 A1 和 A2 的最新結論')">匯總 A1 和 A2</span>
    </div>
  </div>
  <div id="out"></div>
  <div class="pipeline">
    <div class="tt">這個智能體在背後做了四步</div>
    <div class="steps">
      <span class="step">① 呼叫 A1 新聞</span><span class="arrow">→</span>
      <span class="step">② 呼叫 A2 政要</span><span class="arrow">→</span>
      <span class="step">③ 大模型匯總＋調解分歧</span><span class="arrow">→</span>
      <span class="step">④ 出晨報＋證據鏈</span>
    </div>
  </div>
</main>
<script>
const $=s=>document.querySelector(s);
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function loading(t){$('#out').innerHTML='<div class="loading"><div class="pulse">⏳ '+esc(t)+'…</div><div style="margin-top:8px;font-size:12px">正在呼叫 A1 新聞與 A2 政要監控，約 15 秒</div></div>'}
function render(d){
  if(d.detail){$('#out').innerHTML='<div class="loading">出錯：'+esc(d.detail.message||d.detail)+'</div>';return}
  let h='';
  if(d.note){h+='<div class="note">ℹ '+esc(d.note)+'</div>';}
  h+='<div class="card"><h2 class="headline">'+esc(d.headline)+'</h2>'+
     (d.question?'<p class="qtxt">你的問題：'+esc(d.question)+'</p>':'')+
     '<div class="brief">'+esc(d.brief)+'</div></div>';
  h+='<div class="card"><p class="sec-title">證據鏈（每條結論可追溯來源）</p>'+
     ((d.evidence||[]).map(v=>'<div class="ev"><b>'+esc(v.agent)+'</b><div class="p">'+esc(v.point)+'</div></div>').join('')||'<div class="p">（無）</div>')+
     '</div>';
  if((d.disagreements||[]).length){
    h+='<div class="card"><p class="sec-title">分歧意見（兩邊都如實列出）</p>'+
       (d.disagreements||[]).map(v=>'<div class="dis"><div class="t">'+esc(v.topic)+'</div><div class="s"><span>A1：</span>'+esc(v.a1)+'</div><div class="s"><span>A2：</span>'+esc(v.a2)+'</div></div>').join('')+
       '</div>';
  }
  h+='<div class="risk">⚠ '+esc(d.risk_note||'')+'</div>';
  $('#out').innerHTML=h;
  renderUpstream(d.upstream_ok);
}
function renderUpstream(ok){
  ok=ok||{a1:false,a2:false};
  $('#upstream').innerHTML=
    `<span class="up"><span class="dot ${ok.a1?'on':'off'}"></span>A1 新聞情報 ${ok.a1?'已連線':'未連線'}</span>`+
    `<span class="up"><span class="dot ${ok.a2?'on':'off'}"></span>A2 政要監控 ${ok.a2?'已連線':'未連線'}</span>`;
}
async function runA5(preset){
  const q=preset!==undefined?preset:$('#q').value;
  $('#send').disabled=true;
  loading('指揮官正在匯總');
  try{
    const d=await(await fetch('/api/v1/commander/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q})})).json();
    render(d);
  }catch(e){$('#out').innerHTML='<div class="loading">請求失敗，請確認服務已啟動</div>'}
  finally{$('#send').disabled=false}
}
runA5('生成今天的晨報');
</script>
</body>
</html>
